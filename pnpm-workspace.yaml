allowBuilds:
  esbuild: true
  sharp: true

blockExoticSubdeps: true
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@projectwallace/*'
  - sharp@0.35.5
  - deepmerge@4.3.2
trustPolicy: no-downgrade

catalog:
  '@projectwallace/css-analyzer': ^9.9.5
  '@projectwallace/css-parser': ^0.19.3
  '@projectwallace/format-css': ^3.2.2
  '@projectwallace/stylelint-plugin': ^0.7.2
  '@projectwallace/color-sorter': ^9.0.0
  runed: ^0.38.0
  vite: 8.3.5

overrides:
  # Pinned versions to make sure we always only bundle 1 version of each
  '@projectwallace/css-analyzer': 'catalog:'
  '@projectwallace/css-parser': 'catalog:'
  '@projectwallace/format-css': 'catalog:'
  '@projectwallace/color-sorter': 'catalog:'
  runed: 'catalog:'
  vite: 'catalog:'
  # 1.33.0 breaks the build on ::search-text:current (see style.css); pin until fixed upstream
  lightningcss: 1.32.0
  # svelte-check still declares ^4.0.1, but 4.0.3 lost provenance; v5 has it restored
  chokidar: 5.0.0
