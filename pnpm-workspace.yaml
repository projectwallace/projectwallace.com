allowBuilds:
  esbuild: true
  sharp: true

blockExoticSubdeps: true
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@projectwallace/*'
trustPolicy: no-downgrade

overrides:
  # Pinned versions to make sure we always only bundle 1 version of each
  '@projectwallace/css-analyzer': $@projectwallace/css-analyzer
  '@projectwallace/css-parser': $@projectwallace/css-parser
  '@projectwallace/format-css': $@projectwallace/format-css
  color-sorter: $color-sorter
  # Security-based pinned versions
  esbuild@>=0.17.0 <0.28.1: '>=0.28.1'
  runed: $runed
  sharp: 0.35.0
  vite: $vite
  # 1.33.0 breaks the build on ::search-text:current (see style.css); pin until fixed upstream
  lightningcss: 1.32.0
  # svelte-check still declares ^4.0.1, but 4.0.3 lost provenance; v5 has it restored
  chokidar: 5.0.0
