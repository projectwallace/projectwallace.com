allowBuilds:
  esbuild: true
  sharp: true

minimumReleaseAgeExclude:
  - cookie@0.7.0
  - js-yaml@4.3.0
  - fast-uri@3.1.3 || 3.1.4
  - sharp@0.35.0
  - postcss@8.5.18
  - '@sveltejs/kit@2.69.1'

overrides:
  # Pinned versions to make sure we always only bundle 1 version of each
  '@projectwallace/css-analyzer': $@projectwallace/css-analyzer
  '@projectwallace/css-design-tokens': $@projectwallace/css-design-tokens
  '@projectwallace/css-parser': $@projectwallace/css-parser
  '@projectwallace/format-css': $@projectwallace/format-css
  color-sorter: $color-sorter
  # Security-based pinned versions
  esbuild@>=0.17.0 <0.28.1: '>=0.28.1'
  runed: $runed
  sharp: 0.35.0
  vite: $vite

settings:
  blockExoticSubdeps: true
  minimumReleaseAge: 10080
  minimumReleaseAgeExclude:
    - '@projectwallace/*'
  trustPolicy: no-downgrade
