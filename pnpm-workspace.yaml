allowBuilds:
  esbuild: true
  sharp: true

blockExoticSubdeps: true
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@projectwallace/*'
  - color-sorter
  - cookie@0.7.0
  - '@sveltejs/acorn-typescript@1.0.13'
  - '@sveltejs/adapter-netlify@7.0.0-next.8'
  - '@sveltejs/kit@3.0.0-next.23'
  - '@sveltejs/load-config@0.2.3'
  - '@sveltejs/enhanced-img@0.11.0'
  - '@sveltejs/vite-plugin-svelte@7.2.0'
  - 'svelte-check@4.7.6'
  - nanoid@3.3.18
trustPolicy: no-downgrade

catalog:
  '@projectwallace/css-analyzer': ^9.9.3
  '@projectwallace/css-parser': ^0.18.2
  '@projectwallace/format-css': ^3.1.6
  color-sorter: ^8.0.2
  runed: ^0.37.1
  vite: 8.2.1

overrides:
  # Pinned versions to make sure we always only bundle 1 version of each
  '@projectwallace/css-analyzer': 'catalog:'
  '@projectwallace/css-parser': 'catalog:'
  '@projectwallace/format-css': 'catalog:'
  color-sorter: 'catalog:'
  # Security-based pinned versions
  esbuild@>=0.17.0 <0.28.1: '>=0.28.1'
  runed: 'catalog:'
  sharp: 0.35.0
  vite: 'catalog:'
  # 1.33.0 breaks the build on ::search-text:current (see style.css); pin until fixed upstream
  lightningcss: 1.32.0
  # svelte-check still declares ^4.0.1, but 4.0.3 lost provenance; v5 has it restored
  chokidar: 5.0.0
  cookie@<0.7.0: ^0.7.0
  nanoid@<3.3.18: ^3.3.18
